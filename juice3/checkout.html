<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Zest & Sip Juice Co.</title>
    <style>
        :root { --primary: #2e7d32; --secondary: #ffa000; --light: #f9f9f9; --dark: #212121; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; color: var(--dark); background: var(--light); }
        header { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); text-decoration: none; }
        .container { max-width: 800px; margin: 40px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .btn-pay { background: #2e7d32; color: white; width: 100%; padding: 14px; border: none; border-radius: 25px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 20px; }
        .btn-pay:hover { background: #1b5e20; }
        .summary-box { background: #f0f4c3; padding: 15px; border-radius: 4px; margin-bottom: 20px; font-weight: 500; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">🥤 Zest & Sip Co.</a>
    </header>

    <div class="container">
        <h2>Secure Checkout</h2>
        <div class="summary-box" id="order-summary">Order Total: $0.00</div>
        
        <form onsubmit="processPayment(event)">
            <h3>1. Fulfillment Method</h3>
            <div class="form-group radio-group">
                <label><input type="radio" name="fulfillment" value="pickup" checked onchange="toggleAddress(false)"> Store Pickup</label>
                <label><input type="radio" name="fulfillment" value="delivery" onchange="toggleAddress(true)"> Local Delivery</label>
            </div>

            <h3>2. Contact Details</h3>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" required placeholder="john@example.com">
            </div>

            <div id="address-section" style="display:none;">
                <h3>3. Delivery Address</h3>
                <div class="form-group">
                    <label>Street Address</label>
                    <input type="text" id="street" placeholder="123 Main St">
                </div>
            </div>

            <h3>4. Dummy Payment (Simulated Integration)</h3>
            <div class="form-group">
                <label>Card Number</label>
                <input type="text" required placeholder="4111 2222 3333 4444">
            </div>
            <div class="form-group" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Expiry</label>
                    <input type="text" required placeholder="MM/YY">
                </div>
                <div style="flex:1;">
                    <label>CVV</label>
                    <input type="text" required placeholder="123">
                </div>
            </div>

            <button type="submit" class="btn-pay">Pay & Place Order</button>
        </form>
    </div>

    <script>
        const cart = JSON.parse(localStorage.getItem('juiceCart') || '[]');
        let total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById('order-summary').innerText = `Order Total: $${total.toFixed(2)}`;

        function toggleAddress(show) {
            document.getElementById('address-section').style.display = show ? 'block' : 'none';
            document.getElementById('street').required = show;
        }

        function processPayment(e) {
            e.preventDefault();
            alert('Payment Successful! Thank you for ordering from Zest & Sip Co. Your order has been recorded.');
            localStorage.removeItem('juiceCart');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
